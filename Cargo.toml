[package]
name = "writely"
version = "0.1.0"
edition = "2021"
description = "A minimal menu-bar app that checks English grammar in any app."

[[bin]]
name = "writely"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tao = "0.37"
tray-icon = "0.25"

[build-dependencies]
embed-manifest = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "NSLayoutManager",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSSecureTextField",
    "NSText",
    "NSTextContainer",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSNotification",
    "NSOperation",
    "NSObject",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSValue",
    "block2",
] }
objc2-application-services = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_RichEdit",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", features = ["zbus"] }
futures-lite = "2"
pollster = "0.4"
gtk = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.packager]
product-name = "Writely"
identifier = "dev.writely.Writely"
out-dir = "dist"
binaries = [{ path = "writely", main = true }]
icons = [
    "packaging/icons/icon-32.png",
    "packaging/icons/icon-128.png",
    "packaging/icons/icon-256.png",
    "packaging/icons/icon-512.png",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "packaging/Info.plist"
# Ad-hoc sign the bundle ("-") so it has a valid, sealed signature. Without
# this the packaged app keeps only the linker's signature on the bare binary,
# which does not cover Info.plist or resources, so macOS reports the
# downloaded app as damaged. Ad-hoc signing is free but is not notarization:
# users get a one-time "Open Anyway" prompt on first launch (see README).
signing-identity = "-"
